events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    server {
        listen 80;

        location / {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}